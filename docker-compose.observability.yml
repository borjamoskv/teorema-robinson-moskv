# [C5-REAL] Observabilidad Física: Prometheus + Grafana
# Aislamiento topológico sin dependencia de nube.

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: cortex_prometheus
    volumes:
      - ./cortex/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - cortex_net

  grafana:
    image: grafana/grafana:latest
    container_name: cortex_grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=cortex_omega_2026
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - cortex_net
    depends_on:
      - prometheus

networks:
  cortex_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
