name: "Deployment Exergy Matrix (Surge/Netlify)"
sys_id: "borjamoskv"
level: "C5-REAL"
description: "Matriz estructural mutante. Las reglas no son pasivas; son vectores de colapso termodinámico ejecutados por el Mutator Engine."
primitives:
  - id: "PRIM-001-ZERO-COMPUTE"
    description: "Apoptosis de SSR en frameworks estáticos (Next.js/Astro/SvelteKit)"
    file_regex: ".*(astro\\.config\\.[jt]s|next\\.config\\.m?[jt]s)$"
    target_pattern: "output:\\s*['\"]server['\"]"
    collapse_state: "output: 'static'"
    weight: 1.0
  - id: "PRIM-010-PURGE-CSS"
    description: "Inyección pasiva de purga en PostCSS/Tailwind"
    file_regex: "tailwind\\.config\\.[jt]s$"
    target_pattern: "purge:\\s*\\[\\]"
    collapse_state: "purge: ['./src/**/*.{js,jsx,ts,tsx,html,astro}']"
    weight: 1.0
  - id: "PRIM-028-HSTS-PRELOAD"
    description: "Forzar HSTS en cabeceras _headers de Netlify"
    file_regex: "_headers$"
    target_pattern: "(?<!Strict-Transport-Security:).*"
    collapse_state: "\\g<0>\n  Strict-Transport-Security: max-age=31536000; includeSubDomains; preload"
    weight: 1.0
  - id: "PRIM-021-TTL-INFINITO"
    description: "Cache agresivo en archivos con hash"
    file_regex: ".*"
    target_pattern: "Cache-Control:.*"
    collapse_state: "Cache-Control: public, max-age=31536000, immutable"
    weight: 1.0
  - id: "PRIM-063-NETLIFY-FORMS"
    description: "Mutación de forms activos a estáticos"
    file_regex: ".*\\.html$"
    target_pattern: "<form(?!.*?netlify).*?>"
    collapse_state: "<form data-netlify=\"true\">"
    weight: 1.0
