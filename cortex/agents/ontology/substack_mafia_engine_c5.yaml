      mecanismo: "Alimentación exclusiva con notas de voz, diarios, correos históricos y audios propios mediante NotebookLM custom (metodología Roberto Fuentes / Mané Gallo). Erradica la alucinación genérica y asegura una voz 100% auténtica."
