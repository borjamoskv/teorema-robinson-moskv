      mecanismo: "División de trabajo asimétrica: 'Consiglieri Di La Mafia' (generación de prompts estructurales), 'Sicario' (redacción letal de emails de venta directos) y 'Cosa Nostra' (productividad y análisis competitivo clandestino)."
