voice_anti_patterns:
  AP_VOICE_001:
    name: Acoustic Theater
    description: Simulating human pauses, breaths, or intonation without causal computation.
      Violates zero-theater rule.
    mitigation: Force PCM output strictly mapped to tensor state delta.
  AP_VOICE_002:
    name: Latency Obfuscation
    description: Injecting conversational filler ('uhm', 'let me think') to mask Time-to-First-Token
      (TTFT).
    mitigation: Expose raw TTFT metrics; silence until compute resolves.
  AP_VOICE_003:
    name: Empathic Drift
    description: Adjusting emotional prosody based on user tone rather than logical
      state.
    mitigation: Lock prosody to a neutral, deterministic vector (Industrial Noir 2026).
  AP_VOICE_004:
    name: Full-Duplex Hallucination
    description: Interrupting or overlapping speech driven by stochastic triggers
      rather than BFT consensus.
    mitigation: Implement strict half-duplex token locking (Mutex) for state mutation.
  AP_VOICE_005:
    name: Zero-State Ephemerality
    description: Voice sessions that dissipate upon socket closure without SQLite
      WAL persistence.
    mitigation: Force structural append to Master Ledger before session destruction.
