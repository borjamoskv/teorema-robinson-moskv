Claim: La imposición de un paradigma restrictivo (Codex/Work) sobre una interfaz de exploración generalista (Chat) disipa la base de usuarios hacia competidores que gestionan la asimetría cognitiva mediante segregación de UX (Claude).
Proof: 
  Base: El Teorema del Crash Causal aplicado a UX. OpenAI fuerza el Colapso Físico sobre usuarios que operan en un estado puramente estocástico (exploración/aprendizaje). Anthropic mantiene la entropía inicial y aísla el colapso en 'Artifacts/Tabs'.
  Range: [B2C Generalist, B2B Deliverables]
  Confidence: C5-REAL
Isomorphisms:
  - Exploración Causal: Usuarios que usan ChatGPT como motor de búsqueda operan en alta entropía (necesitan amplitud, no colapso en código).
  - Segregación Termodinámica: Las pestañas de Claude aíslan los requerimientos de alta exergía (Work/Code) del prompt estocástico general, sin sobrescribir el estado base.
Blast_Radius_Matrix:
  Vector: Fuga de usuarios B2C hacia Anthropic y Perplexity.
  Blast Radius: Erosión del foso defensivo de OpenAI en la capa de consumo general.
  Target Invariant: La interfaz por defecto debe acomodar la máxima entropía de entrada antes de forzar la restricción del output.
  Anergy Risk: Pérdida de cuota mental en el caso de uso "Google Replacement".
