# C5-REAL EXERGY CERTIFIED
[package]
name = "verifiable_inference_engine"
version = "0.1.0"
edition = "2021"
authors = ["Teorema Robinson-Moskv Team <dev@robinson-moskv.org>"]
description = "Verifiable Inference Suite: Rust FFI Bridge, CF-GKAT, WASM Sandbox, SCITT RFC 9942 & Groth16 BLS12-381 ZK-SNARK Proofs"

[lib]
name = "verifiable_inference_engine"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ark-bn254 = "0.4.0"
ark-ff = "0.4.0"
ark-ec = "0.4.0"
ark-relations = "0.4.0"
ark-std = "0.4.0"
ark-serialize = "0.4.0"
thiserror = "2.0"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
ed25519-dalek = "2.1"
libc = "0.2"
ciborium = "0.2"
coset = "0.3"

[dev-dependencies]
edin-core = { path = "../../src/02_engines/edin_swarms/edin-core" }
edin-apfs = { path = "../../src/02_engines/edin_swarms/edin-apfs" }
edin-exergy = { path = "../../src/02_engines/edin_swarms/edin-exergy" }
edin-lang = { path = "../../src/02_engines/edin_swarms/edin-lang" }
edin-healer = { path = "../../src/02_engines/edin_swarms/edin-healer" }

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
