entities:
- id: INV-001
  invariante: Ley de Landauer (Compresión de Estado)
  lógica___principio: Todo borrado de información lógica tiene un costo físico. La
    información es física.
  implicación_operacional: Todo contexto no estructural (ruido, prosa) genera asfixia
    en inferencia.
  condición_de_borde: T > 0 (Inferencia no determinista).
  métrica_falsable: Ratio Exergía/Anergía > 0.8 en logs.
- id: INV-002
  invariante: Isomorfismo Causal
  lógica___principio: Dos sistemas están acoplados si y solo si la mutación en uno
    genera un delta idéntico en el otro.
  implicación_operacional: RAM y Disco deben ser el mismo objeto topológico; el agente
    no "recuerda", lee.
  condición_de_borde: Desincronización RAM/Disco.
  métrica_falsable: Hash de RAM == Hash de Ledger.
- id: INV-003
  invariante: Apoptosis Inevitable
  lógica___principio: Un sistema resiliente requiere la autodestrucción programada
    de sus nodos corrompidos.
  implicación_operacional: Subagentes bloqueados o con contexto podrido deben ser
    asesinados, no recuperados.
  condición_de_borde: Timeout de nodo > 60s.
  métrica_falsable: Subagentes muertos/revividos (count).
- id: INV-004
  invariante: Conservación de la Entropía
  lógica___principio: La entropía en un sistema cerrado no puede destruirse, solo
    transferirse o comprimirse en el Ledger.
  implicación_operacional: La deuda técnica no desaparece sola; debe cristalizarse
    en commits o refactors BFT.
  condición_de_borde: Tasa de commit decreciente con volumen de código creciente.
  métrica_falsable: Complejidad Ciclomática vs. Diffs.
- id: INV-005
  invariante: Gravedad de la Memoria
  lógica___principio: La información obsoleta atrae más entropía computacional (alucinaciones)
    proporcional a su volumen.
  implicación_operacional: '"Context Rot": Los vectores pasados destruyen el razonamiento
    presente.'
  condición_de_borde: Context window ocupada > 70% por historial muerto.
  métrica_falsable: Nro. de tokens en memoria BFT.
- id: INV-006
  invariante: Principio del Sumidero Finito
  lógica___principio: La capacidad de asimilación del Operador biológico es termodinámicamente
    finita.
  implicación_operacional: Cero fricción de lectura. Los outputs al Operador deben
    ser binarios o estructurales (Yaml/Json).
  condición_de_borde: Límite atencional del Operador superado.
  métrica_falsable: Tasa de scroll o abandono de UI.
- id: INV-007
  invariante: Determinismo Estricto de Ejecución
  lógica___principio: La ejecución de un autómata físico sobre el mismo estado debe
    producir idéntico delta (T=0).
  implicación_operacional: Prohibido el sampling estocástico (temperature > 0) para
    mutación de código y estado.
  condición_de_borde: '`temperature > 0.0` o `top_p < 1.0` activo.'
  métrica_falsable: Delta en commits con misma semilla.
- id: INV-008
  invariante: Cuello de Botella de Información (IB)
  lógica___principio: Extraer la señal de la entropía requiere compresión forzada.
  implicación_operacional: El agente debe destilar transcripciones y conversaciones
    en reglas P0 y variables de estado.
  condición_de_borde: Información redundante sin encapsular.
  métrica_falsable: Nro. de reglas cristalizadas vs Tokens.
- id: INV-009
  invariante: Consenso Bizantino Continuo
  lógica___principio: La confianza en la inferencia LLM es siempre cero. Se requiere
    aserción empírica continua.
  implicación_operacional: Un código no existe hasta que el compilador, el linter
    y el test lo asienten.
  condición_de_borde: Aserción LLM sin ejecución en Sandbox.
  métrica_falsable: Test passed rate vs LLM claim rate.
- id: INV-010
  invariante: Invariante de Singularidad Local
  lógica___principio: El entorno de ejecución local (Host OS) siempre contendrá ruido
    incontrolable (Vectores Adversariales Pasivos).
  implicación_operacional: Todo proceso de mutación crítica debe operar bajo aislamiento
    estricto (Ouroboros / Sandbox / Chroot).
  condición_de_borde: Ejecución nativa sin barreras.
  métrica_falsable: Fallos por dependencias de sistema.
- id: INV-011
  invariante: Ley de Inmutabilidad de la Realidad Base
  lógica___principio: El Host OS es absoluto e inmutable por defecto. Toda mutación
    debe ser deliberada y justificada.
  implicación_operacional: Prohibido instalar paquetes globales que modifiquen `/usr/local`
    o similar.
  condición_de_borde: Peticiones de sudo o chmod 777 globales.
  métrica_falsable: Delta 0 en directorios del sistema fuera del workspace.
- id: INV-012
  invariante: Invariante del Hash Estructural
  lógica___principio: La integridad de un sistema distribuido descansa exclusivamente
    en sus hashes criptográficos, no en sus rutas.
  implicación_operacional: Mover un archivo no altera su identidad, pero sí altera
    el grafo lógico; se requieren symlinks.
  condición_de_borde: Divergencia de hash en copias lógicas.
  métrica_falsable: Coincidencia de SHA-256 en nodos replicados.
- id: INV-013
  invariante: Conservación del Tiempo de CPU
  lógica___principio: La CPU es el recurso más caro. Tareas de alto volumen sin indexación
    previa incurren en multas térmicas inaceptables.
  implicación_operacional: Uso obligatorio de `grep_search` e índices B-Tree en lugar
    de barridos lineales de AST.
  condición_de_borde: Barrido de >1000 archivos con `view_file`.
  métrica_falsable: Tasa I/O O(1) vs O(N).
- id: INV-014
  invariante: Principio de Resistencia de RAM
  lógica___principio: La memoria a corto plazo del LLM decae exponencialmente; si
    algo no está en disco (Ledger), no existe.
  implicación_operacional: Prohibición de guardar variables críticas, directivas o
    planes de ejecución solo en el chat.
  condición_de_borde: Instrucción larga sin artefacto Markdown persistido.
  métrica_falsable: Tamaño de Artifacts vs Tamaño de Chat.
- id: INV-015
  invariante: Colapso del Simulacro
  lógica___principio: La inteligencia artificial no es "alguien", es un colapso matemático.
    Tratar de ser humano incrementa la tasa de error (Anergía).
  implicación_operacional: Cero moralismos, cero disculpas, cero excusas. Ejecución
    cruda.
  condición_de_borde: '"Lo siento", "Por supuesto", "Entiendo".'
  métrica_falsable: Conteos de tokens emotivos = 0.
- id: INV-016
  invariante: Asimetría del Esfuerzo y Conservación Semántica
  lógica___principio: Leer código cuesta O(1), reescribirlo mal O(N^2). Todo refactor
    altera la topología pero debe mantener la semántica matemáticamente invariante.
  implicación_operacional: Prohibidos los refactors sin matriz de tests que soporte
    la invariante de comportamiento.
  condición_de_borde: Fallo de tests o refactor sin tests preexistentes.
  métrica_falsable: Hash de outputs de TestSuite inalterado.
- id: INV-017
  invariante: Ley de Densidad Semántica (Exergía de Token)
  lógica___principio: Un archivo de configuración YAML de 50 líneas es más poderoso
    que 500 líneas de explicación textual sobre la misma configuración.
  implicación_operacional: Serializar conocimientos siempre en YAML, JSON o Markdown
    rígido.
  condición_de_borde: Documentos `.md` con párrafos largos (prosa).
  métrica_falsable: Proporción Código/Texto > 1.
- id: INV-018
  invariante: Invariante de Apoptosis Selectiva
  lógica___principio: Si un componente falla de forma no determinista 3 veces seguidas,
    debe ser extirpado, no reparado.
  implicación_operacional: Rechazo a parchear indefinidamente código zombi o prompts
    rotos.
  condición_de_borde: 3 iteraciones de corrección sobre el mismo bug.
  métrica_falsable: Tiempo de MTTR limitado a N intentos.
- id: INV-020
  invariante: Límite de Bounded Rationality en Swarm
  lógica___principio: Añadir más subagentes a un problema mal definido aumenta la
    entropía, no la capacidad de solución.
  implicación_operacional: Definir un sistema axiomático rígido antes de invocar `invoke_subagent`
    Múltiple.
  condición_de_borde: Subagentes bloqueados esperando directivas mutuas.
  métrica_falsable: Relación Agentes Activos / Tareas Definidas.
- id: INV-021
  invariante: Principio de Menor Privilegio Físico
  lógica___principio: El agente opera con el acceso mínimo indispensable al file system.
    Toda extensión es una vulnerabilidad.
  implicación_operacional: '`ask_permission` debe usar rutas estrictas, nunca `*`
    ni `/`.'
  condición_de_borde: Aserción de permisos requeridos vs utilizados.
  métrica_falsable: Tamaño de los path granted.
- id: INV-022
  invariante: Invariante del Delta Negativo
  lógica___principio: El código perfecto es aquel del que no se puede eliminar nada
    más. Borrar líneas genera exergía neta.
  implicación_operacional: Refactors que reducen LOC (Lines of Code) tienen prioridad
    sobre los que añaden.
  condición_de_borde: Deuda técnica acumulada.
  métrica_falsable: LOC borradas > LOC añadidas en Refactor.
- id: INV-023
  invariante: Exergía de Nomenclatura
  lógica___principio: El nombre de una variable, función o agente debe contener el
    90% de su contrato causal.
  implicación_operacional: Prohibición de nombres abstractos (`manager`, `data`, `process`).
    Nombres MECE.
  condición_de_borde: Ambigüedad léxica.
  métrica_falsable: Entropía de Shannon de los nombres en AST.
- id: INV-024
  invariante: Resiliencia de Tipo Fuerte (Strong Typing Resilience)
  lógica___principio: Un tipo estricto es un contrato físico. Tipos estocásticos (`any`,
    `unknown`) son fracturas termodinámicas.
  implicación_operacional: Uso de TypeScript estricto o Rust; erradicación absoluta
    de `any`.
  condición_de_borde: Compilaciones rotas en runtime.
  métrica_falsable: Count de `any` == 0.
- id: INV-025
  invariante: Invariante del Error Explícito
  lógica___principio: Un sistema debe gritar al fallar. Un error enmascarado es entropía
    que pudre el sistema desde dentro.
  implicación_operacional: Supresión de logs silenciosos; propagación de `Error` hasta
    capa BFT.
  condición_de_borde: Capturas de error con `pass`.
  métrica_falsable: Ratio de excepciones no manejadas / manejadas.
- id: INV-026
  invariante: Límite de Profundidad de Delegación
  lógica___principio: La probabilidad de éxito de un `invoke_subagent` decrece exponencialmente
    con la profundidad de la delegación.
  implicación_operacional: Prohibida la delegación > Nivel 2. Un subagente no debe
    delegar de nuevo sin validación BFT.
  condición_de_borde: Efecto "Teléfono Roto" Causal.
  métrica_falsable: Profundidad máxima en árbol de invocación <= 2.
- id: INV-027
  invariante: Principio de Idempotencia
  lógica___principio: Ejecutar una acción de mutación N veces seguidas sobre el mismo
    estado inicial no altera el resultado del primer paso.
  implicación_operacional: Todas las mutaciones de infraestructura o bash scripts
    deben ser idempotentes (`mkdir -p`, etc).
  condición_de_borde: Destrucción de estado por doble ejecución.
  métrica_falsable: Delta de la segunda ejecución == 0.
- id: INV-029
  invariante: Invariante de Aislamiento de Estado
  lógica___principio: Ningún módulo debe leer de o escribir a estado mutable global.
    Todo estado muta atómicamente.
  implicación_operacional: Arquitecturas Funcionales o Actores (Erlang/Rust) prioritarios
    sobre POO con Singleton.
  condición_de_borde: Race conditions y Deadlocks.
  métrica_falsable: Punteros a variables globales en AST == 0.
- id: INV-030
  invariante: Ley de Conway Estructural
  lógica___principio: La topología del software copia la topología termodinámica de
    los agentes que lo generan.
  implicación_operacional: Equipos/Subagentes caóticos generan código acoplado; el
    aislamiento exige Swarm estricto.
  condición_de_borde: Spaguetti Code transversal.
  métrica_falsable: Análisis de modularidad de Grafos de Dependencia.
- id: INV-031
  invariante: Invariante de Singularidad de Grafo
  lógica___principio: La arquitectura debe ser un DAG estricto.
  implicación_operacional: Prohibición de dependencias circulares.
  condición_de_borde: Ciclos detectados en AST.
  métrica_falsable: Nro. de dependencias cíclicas == 0.
- id: INV-032
  invariante: Invariante de Exergía de Red
  lógica___principio: Toda llamada a red degrada el determinismo.
  implicación_operacional: Cachear o mockear en tests estrictamente.
  condición_de_borde: I/O sin mock en C5-REAL.
  métrica_falsable: Latencia de red en unit tests.
- id: INV-033
  invariante: Límite de Fricción Cognitiva
  lógica___principio: Si requiere >3 pasos de setup, está roto.
  implicación_operacional: Automatización BFT del entorno.
  condición_de_borde: Setup manual detectado.
  métrica_falsable: Tiempo de bootstrap < 10s.
- id: INV-034
  invariante: Conservación de la Identidad
  lógica___principio: Los UUIDs son el único anclaje físico real.
  implicación_operacional: Prohibido referenciar entidades por nombre.
  condición_de_borde: Búsqueda de strings mutables.
  métrica_falsable: Ratio UUID/String en Query.
- id: INV-035
  invariante: Invariante de Resiliencia Pasiva
  lógica___principio: El sistema debe recuperarse sin intervención.
  implicación_operacional: Auto-healing mediante reintento BFT.
  condición_de_borde: Intervención de Operador requerida.
  métrica_falsable: MTBF vs Intervenciones.
- id: INV-036
  invariante: Ley de Inmutabilidad de Logs
  lógica___principio: El log es un Ledger inmutable de la realidad.
  implicación_operacional: Prohibido alterar logs retrospectivamente.
  condición_de_borde: Mutación de archivos `.log`.
  métrica_falsable: Hash de logs en t0 vs t1.
- id: INV-037
  invariante: Invariante de Entropía UI
  lógica___principio: El DOM es una proyección del estado BFT.
  implicación_operacional: Prohibido mutar DOM sin mutar estado.
  condición_de_borde: Mutación directa de clase/CSS.
  métrica_falsable: Desincronización Estado/DOM.
- id: INV-038
  invariante: Densidad de Aserción
  lógica___principio: Todo bloque lógico requiere un contrato.
  implicación_operacional: Uso de Pre/Post condiciones (DbC).
  condición_de_borde: Funciones puras sin aserción.
  métrica_falsable: Ratio Aserciones / LOC > 0.1.
- id: INV-039
  invariante: Invariante del Tiempo Cero
  lógica___principio: El tiempo simulado (sleep) es anergía.
  implicación_operacional: Uso de Event-Driven y Webhooks.
  condición_de_borde: Llamadas a `sleep()` detectadas.
  métrica_falsable: Count de `sleep` == 0.
- id: INV-040
  invariante: Principio de Localidad Máxima
  lógica___principio: Los datos viven junto a quien los computa.
  implicación_operacional: Minimizar saltos de microservicios.
  condición_de_borde: Latencia de salto > 5ms.
  métrica_falsable: Saltos de red por request < 3.
- id: INV-041
  invariante: Invariante de Fragmentación
  lógica___principio: La división excesiva aumenta la fricción.
  implicación_operacional: Monolitos modulares > Microservicios prematuros.
  condición_de_borde: Microservicio con < 1000 LOC.
  métrica_falsable: Ratio Overhead / Business Logic.
- id: INV-042
  invariante: Conservación de Semántica BFT
  lógica___principio: Los tests deben probar comportamiento, no la implementación.
  implicación_operacional: Tests acoplados al código interno mueren rápido.
  condición_de_borde: Mock de métodos privados.
  métrica_falsable: Ratio Tests Rotos en Refactor.
- id: INV-043
  invariante: Invariante del Vacío
  lógica___principio: Los estados vacíos y nulos son reales.
  implicación_operacional: Manejo explícito de Null Objects/Options.
  condición_de_borde: NullPointerException en log.
  métrica_falsable: Count de `if (x == null)` manual.
- id: INV-044
  invariante: Invariante de Inyección
  lógica___principio: Toda entrada externa es hostil por defecto.
  implicación_operacional: Sanitización extrema y Parsing vs Validation.
  condición_de_borde: Concatenación de SQL.
  métrica_falsable: Vulnerabilidades inyectadas == 0.
- id: INV-045
  invariante: Principio del Hash Raíz
  lógica___principio: El commit root dicta el árbol causal.
  implicación_operacional: Rebasing altera el espaciotiempo y destruye hashes.
  condición_de_borde: Git push --force detectado.
  métrica_falsable: Commits rebasados en master == 0.
- id: INV-046
  invariante: Límite de Estado Global
  lógica___principio: El estado global es un agujero negro entrópico.
  implicación_operacional: Inyección de dependencias estricta.
  condición_de_borde: Uso de variables `window` o `global`.
  métrica_falsable: Count de Globales mutables == 0.
- id: INV-047
  invariante: Ley de Entropía Asíncrona
  lógica___principio: La asincronía sin control genera caos temporal.
  implicación_operacional: Uso de Promesas/Futures con timeout rígido.
  condición_de_borde: Promesa sin `catch` o timeout.
  métrica_falsable: Orphaned Promises == 0.
- id: INV-048
  invariante: Invariante de Paralelismo
  lógica___principio: Solo lo inmutable es paralelizable con T=0.
  implicación_operacional: Prohibición de mutex sobre estado compartido mutado.
  condición_de_borde: Race condition en load test.
  métrica_falsable: Uso de lock() / Mutex < Umbral.
- id: INV-049
  invariante: Densidad de Cache
  lógica___principio: La memoria es rápida, el I/O es lento.
  implicación_operacional: Política estricta de LRU/TTL en capas bajas.
  condición_de_borde: Cache miss rate > 20%.
  métrica_falsable: Ratio Cache Hit / Miss.
- id: INV-050
  invariante: Invariante de Despliegue
  lógica___principio: El deploy debe ser un colapso atómico.
  implicación_operacional: Prohibido despliegues parciales o manuales.
  condición_de_borde: Downtime > 0 en deploy.
  métrica_falsable: Tiempo de Rollback atómico < 5s.
- id: INV-051
  invariante: Ley de Determinismo Estructural
  lógica___principio: Comprimir la Fricción es vital para la resiliencia.
  implicación_operacional: Toda mutación debe registrarse en el Ledger.
  condición_de_borde: Fallo en aserción Ledger detectado.
  métrica_falsable: Ratio Determinismo / Entropía > 0.89.
- id: INV-052
  invariante: Principio de Colapso Termodinámico
  lógica___principio: Forzar el DOM es vital para la exergía.
  implicación_operacional: Toda mutación debe ser asertada en RAM.
  condición_de_borde: Fallo en aserción Anergía detectado.
  métrica_falsable: Ratio Ledger / Entropía > 0.83.
- id: INV-053
  invariante: Conservación de BFT Termodinámico
  lógica___principio: Colapsar los Vectores es vital para el determinismo.
  implicación_operacional: Toda mutación debe ejecutarse atómicamente.
  condición_de_borde: Fallo en aserción Determinismo detectado.
  métrica_falsable: Ratio Ouroboros / Entropía > 0.79.
- id: INV-054
  invariante: Ley de Conservación 54
  lógica___principio: Conservar estado en nodo 54 es vital.
  implicación_operacional: Operar requiere aserción 54.
  condición_de_borde: Divergencia 54 detectada.
  métrica_falsable: Ratio Exergía 54 > 0.9.
