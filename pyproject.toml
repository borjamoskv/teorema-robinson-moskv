[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "babylon-60"
version = "100.100.103"
authors = [
  { name="Borja Moskv", email="borjamoskv@users.noreply.github.com" },
]
description = "CORTEX C5-REAL Sovereign Autonomous Execution Core"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytest",
    "aiosqlite",
]

[project.urls]
"Homepage" = "https://github.com/borjamoskv/BABYLON-60"
"Bug Tracker" = "https://github.com/borjamoskv/BABYLON-60/issues"

[tool.pytest.ini_options]
norecursedirs = ["babylon60", "node_modules", ".venv"]

