[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "babylon-60"
version = "100.100.103"
authors = [
  { name="Borja Moskv", email="borjamoskv@users.noreply.github.com" },
]
description = "CORTEX C5-REAL Sovereign Autonomous Execution Core"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytest",
    "aiosqlite",
    "pydantic",
    "pynacl",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "einops>=0.8.2",
    "descript-audio-codec>=1.0.0",
    "librosa>=0.11.0",
    "numba>=0.66.0",
]

[project.urls]
"Homepage" = "https://github.com/borjamoskv/BABYLON-60"
"Bug Tracker" = "https://github.com/borjamoskv/BABYLON-60/issues"

[tool.pytest.ini_options]
norecursedirs = ["babylon60", "node_modules", ".venv"]

