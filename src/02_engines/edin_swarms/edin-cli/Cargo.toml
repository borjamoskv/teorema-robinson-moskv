# C5-REAL EXERGY CERTIFIED
[package]
name = "edin-cli"
version = "0.1.0"
edition = "2021"
authors = ["Borja & Exergy Swarm Team"]
description = "CLI y Dashboard TUI de máxima velocidad (<4MB binario) para Legión Exergética"

[[bin]]
name = "edin"
path = "src/main.rs"

[dependencies]
edin-core = { path = "../edin-core" }
edin-apfs = { path = "../edin-apfs" }
edin-exergy = { path = "../edin-exergy" }
edin-healer = { path = "../edin-healer" }
edin-lang = { path = "../edin-lang" }
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
chrono = "0.4"
