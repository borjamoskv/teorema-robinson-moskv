[package]
name = "strike-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "babylon60"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
rayon = "1.8"
petgraph = "0.6"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
hex = "0.4"
